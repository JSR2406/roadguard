services:
  roadguard:
    build: .
    image: roadguard-pilot:0.2.0
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 512m
    cpus: 1.0
    ports:
      - "127.0.0.1:${ROADGUARD_PORT:-8080}:8080"
    environment:
      ROADGUARD_ALLOWED_ORIGIN: "${ROADGUARD_ORIGIN:-http://localhost:8080}"
    secrets: [roadguard_auth]
    volumes:
      - roadguard_data:/data
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
secrets:
  roadguard_auth:
    file: "${ROADGUARD_AUTH_FILE:?Set ROADGUARD_AUTH_FILE to an existing private credential JSON file}"
volumes:
  roadguard_data:
